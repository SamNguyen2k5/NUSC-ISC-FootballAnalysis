experiment_name: 'ex05_field_masking'

# pitch_cover_model: "wandb_logs/ISC-Football/pc7g8srb/checkpoints/epoch=20-step=252.ckpt"
# gaussian_heatmap_model: "wandb_logs/ISC-Football/j333rvqe/checkpoints/epoch=31-step=896.ckpt"

pitch_calibration_dataset:
  img_folder: 'data/calibration'
  n_limit: 128
  width: 640
  height: 360
  centered: False
  keypoint_only: False
  in_channels: 3

pitch_calibration_datamodule:
  batch_size: 8
  num_workers: 8
  persistent_workers: True

spiideo_dataset:
  base_folder: 'data/SpiideoSynLoc'
  n_limit: 32
  width: 3840
  height: 2160
  n_crops: 32
  crop_width: 960
  crop_height: 540
  crop_export_width: 320
  crop_export_height: 180
  sigma: 8
  oversampling_rate: 16.
  in_channels: 3

spiideo_datamodule:
  batch_size: 8
  num_workers: 10
  persistent_workers: True

trainer:
  accelerator: 'cpu'
  max_epochs: 8