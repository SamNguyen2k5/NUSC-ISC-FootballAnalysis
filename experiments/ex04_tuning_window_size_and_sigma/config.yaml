pitch_calibration_dataset:
  img_folder: 'data/calibration'
  width: 640
  height: 360
  centered: False
  keypoint_only: False
  selected_idxs:
    - 0
    - 3
    - 4
    - 5

spiideo_dataset:
  base_folder: 'data/SpiideoSynLoc'
  n_limit: 32
  width: 3840
  height: 2160
  n_crops: 32
  crop_width: 960
  crop_height: 540
  crop_export_width: 320
  crop_export_height: 180
  sigma: 8
  oversampling_rate: 16.
  in_channels: 3

spiideo_datamodule:
  batch_size: 8
  num_workers: 10
  persistent_workers: True

trainer:
  accelerator: 'gpu'
  max_epochs: 32