experiment_name: 'ex06_player_heatmap_after_masking'

pitch_segmentation_model: "lightning_logs/version_13/checkpoints/epoch=17-step=288.ckpt"
pitch_cover_model: "wandb_logs/ISC-Football/pc7g8srb/checkpoints/epoch=20-step=252.ckpt"
gaussian_heatmap_model: "wandb_logs/ISC-Football/j333rvqe/checkpoints/epoch=31-step=896.ckpt"

# unet_with_gaussian_layer: "wandb_logs/ISC-Football/4z0b0yf4/checkpoints/epoch=31-step=448.ckpt"
unet_with_gaussian_layer: "wandb_logs/ISC-Football/5yaq0s0v/checkpoints/epoch=31-step=512.ckpt"

spiideo_dataset:
  base_folder: 'data/SpiideoSynLoc'
  n_limit: 256
  # n_limit: 4
  # width: 3840
  # height: 2160
  width: 960
  height: 540
  n_crops: 1
  crop_width: 960
  crop_height: 540
  crop_export_width: 320
  crop_export_height: 180
  sigma: 4
  # sigma: 16
  oversampling_rate: 16.
  in_channels: 3

spiideo_datamodule:
  batch_size: 16
  num_workers: 10
  persistent_workers: True

trainer:
  accelerator: 'gpu'
  max_epochs: 32